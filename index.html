<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Branded Image Creator</title>
    <style>
        :root {
            --bg-main: #121212;
            --bg-panel: #1e1e1e;
            --text-main: #e0e0e0;
            --text-muted: #9e9e9e;
            --accent: #6c5ce7;
            --accent-hover: #5a4bcf;
            --border: #333333;
            --error: #ff5252;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-main);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* Layout */
        .app-container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        .canvas-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            overflow: auto;
        }

        .sidebar {
            width: 340px;
            background: var(--bg-panel);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 30px 25px;
            overflow-y: auto;
            box-shadow: -5px 0 20px rgba(0,0,0,0.3);
        }

        h2 { 
            font-size: 24px;
            margin-bottom: 25px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #ffffff;
        }

        /* Canvas Styling */
        canvas {
            max-width: 100%;
            max-height: 100%;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            background-image: 
                linear-gradient(45deg, #2a2a2a 25%, transparent 25%), 
                linear-gradient(-45deg, #2a2a2a 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #2a2a2a 75%), 
                linear-gradient(-45deg, transparent 75%, #2a2a2a 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }

        /* Controls */
        .control-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
        }

        label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Custom File Upload */
        .file-upload-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }
        
        .file-upload-wrapper input[type="file"] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 12px 15px;
            background: var(--border);
            color: var(--text-main);
            border: 1px solid transparent;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
        }

        .btn-primary {
            background: var(--accent);
            color: #fff;
            margin-top: 10px;
        }

        .btn:hover { background: #444; }
        .btn-primary:hover { background: var(--accent-hover); }

        .error-message {
            color: var(--error);
            font-size: 13px;
            margin-top: 8px;
            display: none;
            font-weight: 500;
        }

        /* Inputs */
        select, input[type="color"] {
            width: 100%;
            padding: 10px;
            background: #2a2a2a;
            color: #fff;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-family: inherit;
            font-size: 14px;
            cursor: pointer;
        }

        input[type="color"] {
            height: 42px;
            padding: 2px;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .color-row {
            display: flex;
            gap: 15px;
        }

        /* Visual Swatches */
        .swatch-container {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        .swatch {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid var(--border);
            transition: transform 0.2s, border-color 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .swatch:hover {
            transform: scale(1.15);
            border-color: #fff;
        }

        @media (max-width: 800px) {
            .app-container { flex-direction: column; }
            .sidebar { width: 100%; border-left: none; border-top: 1px solid var(--border); max-height: 50vh; }
            .canvas-area { padding: 20px; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Main Canvas Area -->
        <div class="canvas-area">
            <canvas id="canvas"></canvas>
        </div>

        <!-- Right Side Controls panel -->
        <div class="sidebar">
            <h2>HalfTone Gen</h2>
            
            <div class="control-group">
                <label>Source Image</label>
                <div class="file-upload-wrapper">
                    <button class="btn">Choose File...</button>
                    <input type="file" id="upload" accept="image/*">
                </div>
                <div id="error-msg" class="error-message">Unsupported file. Please upload an image.</div>
            </div>

            <div class="control-group">
                <label for="patternType">Pattern Style</label>
                <select id="patternType">
                    <option value="dots">Dots (Standard)</option>
                    <option value="lines">Lines (Engraving)</option>
                </select>
            </div>

            <div class="control-group">
                <label for="dotSize">Density / Size</label>
                <input type="range" id="dotSize" min="4" max="25" value="8">
            </div>

            <div class="control-group">
                <label for="textureLevel">Texture Jitter</label>
                <input type="range" id="textureLevel" min="0" max="1" step="0.05" value="0.2">
            </div>
            
            <div class="control-group">
                <label>Color Presets</label>
                <div class="swatch-container" id="swatchContainer">
                    <!-- Swatches injected by JS -->
                </div>
            </div>

            <div class="color-row">
                <div class="control-group" style="flex: 1;">
                    <label for="darkColor">Ink Color</label>
                    <input type="color" id="darkColor" value="#1a3b2b">
                </div>
                <div class="control-group" style="flex: 1;">
                    <label for="lightColor">Base Color</label>
                    <input type="color" id="lightColor" value="#e89c4a">
                </div>
            </div>

            <button class="btn btn-primary" id="download">Download Result</button>
        </div>
    </div>

    <script>
        const upload = document.getElementById('upload');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const errorMsg = document.getElementById('error-msg');
        
        const patternTypeInput = document.getElementById('patternType');
        const dotSizeInput = document.getElementById('dotSize');
        const textureLevelInput = document.getElementById('textureLevel');
        
        const darkColorInput = document.getElementById('darkColor');
        const lightColorInput = document.getElementById('lightColor');
        const swatchContainer = document.getElementById('swatchContainer');
        const downloadBtn = document.getElementById('download');

        let originalImage = new Image();

        // Color Palettes
        const palettes = [
            { dark: '#1a3b2b', light: '#e89c4a', name: 'Forest & Orange' },
            { dark: '#0a1945', light: '#e1cbf4', name: 'Navy & Lavender' },
            { dark: '#000000', light: '#ffffff', name: 'Classic B&W' },
            { dark: '#0033aa', light: '#e6f0ff', name: 'Blueprint' },
            { dark: '#4a2c11', light: '#f5e3d2', name: 'Sepia' },
            { dark: '#1a0b2e', light: '#ff007f', name: 'Cyberpunk Neon' },
            { dark: '#3b0000', light: '#ffeb3b', name: 'Crimson & Gold' }
        ];

        // Generate Visual Swatches
        palettes.forEach(p => {
            const swatch = document.createElement('div');
            swatch.className = 'swatch';
            swatch.title = p.name;
            // Create a diagonal split of the two colors
            swatch.style.background = `linear-gradient(135deg, ${p.dark} 50%, ${p.light} 50%)`;
            
            swatch.addEventListener('click', () => {
                darkColorInput.value = p.dark;
                lightColorInput.value = p.light;
                if (originalImage.src) generateHalftone();
            });
            swatchContainer.appendChild(swatch);
        });

        // Handle Image Upload & Validation
        upload.addEventListener('change', function(e) {
            errorMsg.style.display = 'none';
            const file = e.target.files[0];
            if (!file) return;

            // Check if uploaded file is actually an image
            if (!file.type.startsWith('image/')) {
                errorMsg.style.display = 'block';
                return;
            }

            const reader = new FileReader();
            reader.onload = function(event) {
                originalImage.onload = generateHalftone;
                originalImage.src = event.target.result;
            }
            reader.readAsDataURL(file);
        });

        // Re-draw when any setting changes
        [patternTypeInput, dotSizeInput, textureLevelInput, darkColorInput, lightColorInput].forEach(input => {
            input.addEventListener('input', () => {
                if (originalImage.src) generateHalftone();
            });
        });

        // Main Rendering Logic
        function generateHalftone() {
            const patternType = patternTypeInput.value;
            const dotSize = parseInt(dotSizeInput.value);
            const textureLevel = parseFloat(textureLevelInput.value);
            const darkColor = darkColorInput.value;
            const lightColor = lightColorInput.value;

            canvas.width = originalImage.width;
            canvas.height = originalImage.height;

            const offscreenCanvas = document.createElement('canvas');
            offscreenCanvas.width = canvas.width;
            offscreenCanvas.height = canvas.height;
            const offCtx = offscreenCanvas.getContext('2d');
            offCtx.drawImage(originalImage, 0, 0);
            
            const imageData = offCtx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let y = 0; y < canvas.height; y += dotSize) {
                for (let x = 0; x < canvas.width; x += dotSize) {
                    
                    let totalLuminance = 0;
                    let totalAlpha = 0;
                    let pixelCount = 0;

                    for (let dy = 0; dy < dotSize; dy++) {
                        for (let dx = 0; dx < dotSize; dx++) {
                            if (x + dx < canvas.width && y + dy < canvas.height) {
                                const i = ((y + dy) * canvas.width + (x + dx)) * 4;
                                const r = data[i];
                                const g = data[i+1];
                                const b = data[i+2];
                                const a = data[i+3]; 
                                
                                const luminance = (0.299 * r + 0.587 * g + 0.114 * b);
                                totalLuminance += luminance;
                                totalAlpha += a;
                                pixelCount++;
                            }
                        }
                    }

                    const avgAlpha = totalAlpha / pixelCount;
                    if (avgAlpha < 15) {
                        continue; 
                    }

                    // Background Fill
                    ctx.fillStyle = lightColor;
                    ctx.fillRect(x, y, dotSize, dotSize);

                    let avgLuminance = totalLuminance / pixelCount;
                    
                    // Texture noise
                    const noise = (Math.random() - 0.5) * 100 * textureLevel;
                    avgLuminance = Math.max(0, Math.min(255, avgLuminance + noise));
                    
                    const darkness = 1 - (avgLuminance / 255);
                    const sizeMultiplier = 1.3 + (Math.random() - 0.5) * textureLevel * 0.6;
                    
                    const jitterX = (Math.random() - 0.5) * textureLevel * dotSize * 0.4;
                    const jitterY = (Math.random() - 0.5) * textureLevel * dotSize * 0.4;
                    
                    const centerX = x + (dotSize / 2) + jitterX;
                    const centerY = y + (dotSize / 2) + jitterY;

                    if (patternType === 'dots') {
                        const radius = (dotSize / 2) * darkness * sizeMultiplier;
                        if (radius > 0.5) {
                            ctx.fillStyle = darkColor;
                            ctx.beginPath();
                            ctx.arc(centerX, centerY, Math.min(Math.abs(radius), dotSize * 1.5), 0, Math.PI * 2);
                            ctx.fill();
                        }
                    } else if (patternType === 'lines') {
                        const lineWidth = dotSize * darkness * sizeMultiplier * 1.2;
                        if (lineWidth > 0.5) {
                            ctx.strokeStyle = darkColor;
                            ctx.lineWidth = Math.min(lineWidth, dotSize * 1.5);
                            ctx.lineCap = 'round';
                            ctx.beginPath();
                            
                            const angle = Math.PI / 4; 
                            const length = dotSize * 1.5; 
                            
                            const dx = Math.cos(angle) * (length / 2);
                            const dy = Math.sin(angle) * (length / 2);

                            ctx.moveTo(centerX - dx, centerY - dy);
                            ctx.lineTo(centerX + dx, centerY + dy);
                            ctx.stroke();
                        }
                    }
                }
            }
        }

        downloadBtn.addEventListener('click', () => {
            if (!originalImage.src) return alert("Please upload an image first!");
            const link = document.createElement('a');
            link.download = 'halftone-gen-output.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    </script>
</body>
</html>
