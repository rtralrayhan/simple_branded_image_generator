<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data: blob:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none';">
    <title>Branded Image Creator</title>
    <style>
        :root {
            --bg-main: #121212;
            --bg-panel: #1e1e1e;
            --text-main: #e0e0e0;
            --text-muted: #9e9e9e;
            --accent: #6c5ce7;
            --accent-hover: #5a4bcf;
            --border: #333333;
            --error: #ff5252;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-main);
            color: var(--text-main);
            height: 100vh;
            height: 100dvh;
            display: flex;
            overflow: hidden;
        }

        .app-container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        .canvas-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            overflow: auto;
        }

        .sidebar {
            width: 340px;
            background: var(--bg-panel);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 30px 25px;
            overflow-y: auto;
            box-shadow: -5px 0 20px rgba(0,0,0,0.3);
        }

        h2 {
            font-size: 24px;
            margin-bottom: 25px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #ffffff;
        }

        canvas {
            max-width: 100%;
            max-height: 100%;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            background-image:
                linear-gradient(45deg, #2a2a2a 25%, transparent 25%),
                linear-gradient(-45deg, #2a2a2a 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #2a2a2a 75%),
                linear-gradient(-45deg, transparent 75%, #2a2a2a 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }

        .control-group { display: flex; flex-direction: column; margin-bottom: 20px; }

        label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .file-upload-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }

        .file-upload-wrapper input[type="file"] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 12px 15px;
            background: var(--border);
            color: var(--text-main);
            border: 1px solid transparent;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
        }

        .btn-primary {
            background: var(--accent);
            color: #fff;
            margin-top: 10px;
        }

        .btn:hover { background: #444; }
        .btn-primary:hover { background: var(--accent-hover); }

        .file-upload-wrapper input[type="file"]:focus-visible + .btn {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.4);
        }

        .file-name {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 8px;
            word-break: break-all;
            text-transform: none;
            letter-spacing: 0;
        }

        .error-message {
            color: var(--error);
            font-size: 13px;
            margin-top: 8px;
            display: none;
            font-weight: 500;
        }

        select, input[type="color"] {
            width: 100%;
            padding: 10px;
            background: #2a2a2a;
            color: #fff;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-family: inherit;
            font-size: 14px;
            cursor: pointer;
        }

        input[type="color"] { height: 42px; padding: 2px; }
        input[type="range"] { width: 100%; accent-color: var(--accent); cursor: pointer; }

        .color-row { display: flex; gap: 15px; }

        .swatch-container {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        .swatch {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid var(--border);
            transition: transform 0.2s, border-color 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .swatch:hover {
            transform: scale(1.15);
            border-color: #fff;
        }

        @media (max-width: 800px) {
            .app-container { flex-direction: column; }
            .sidebar { width: 100%; border-left: none; border-top: 1px solid var(--border); max-height: 50vh; }
            .canvas-area { padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="canvas-area">
            <canvas id="canvas"></canvas>
        </div>

        <div class="sidebar">
            <h2>Branded Image Creator</h2>

            <div class="control-group">
                <label>Source Image</label>
                <div class="file-upload-wrapper">
                    <input type="file" id="upload" accept="image/png,image/jpeg,image/webp">
                    <label class="btn" for="upload">Choose File...</label>
                </div>
                <div id="file-name" class="file-name">No file selected</div>
                <div id="error-msg" class="error-message">Unsupported file. Please upload an image.</div>
            </div>

            <div class="control-group">
                <label for="patternType">Pattern Style</label>
                <select id="patternType">
                    <option value="dots">Dots (Standard)</option>
                    <option value="lines">Lines (Engraving)</option>
                </select>
            </div>

            <div class="control-group">
                <label for="dotSize">Density / Size</label>
                <input type="range" id="dotSize" min="4" max="25" value="8">
            </div>

            <div class="control-group">
                <label for="textureLevel">Texture Jitter</label>
                <input type="range" id="textureLevel" min="0" max="1" step="0.05" value="0.2">
            </div>

            <div class="control-group">
                <label>Color Presets</label>
                <div class="swatch-container" id="swatchContainer"></div>
            </div>

            <div class="color-row">
                <div class="control-group" style="flex: 1;">
                    <label for="darkColor">Ink Color</label>
                    <input type="color" id="darkColor" value="#1a3b2b">
                </div>
                <div class="control-group" style="flex: 1;">
                    <label for="lightColor">Base Color</label>
                    <input type="color" id="lightColor" value="#e89c4a">
                </div>
            </div>

            <button class="btn btn-primary" id="download">Download Result</button>
        </div>
    </div>

    <script>
        const upload = document.getElementById('upload');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const errorMsg = document.getElementById('error-msg');

        const patternTypeInput = document.getElementById('patternType');
        const dotSizeInput = document.getElementById('dotSize');
        const textureLevelInput = document.getElementById('textureLevel');

        const darkColorInput = document.getElementById('darkColor');
        const lightColorInput = document.getElementById('lightColor');
        const swatchContainer = document.getElementById('swatchContainer');
        const downloadBtn = document.getElementById('download');
        const fileNameEl = document.getElementById('file-name');

        const MAX_PREVIEW_DIMENSION = 1500;

        const MAX_EXPORT_DIMENSION = 4096;
        const MAX_EXPORT_PIXELS = 12e6;

        const ALLOWED_IMAGE_TYPES = new Set(['image/png', 'image/jpeg', 'image/webp']);
        const ALLOWED_EXTENSIONS = /\.(png|jpe?g|webp)$/i;

        let originalImage = new Image();
        let cachedImageData = null;
        let cachedImageSize = { width: 0, height: 0 };
        let currentObjectUrl = null;
        let renderScheduled = false;

        const palettes = [
            { dark: '#1a3b2b', light: '#e89c4a', name: 'Forest & Orange' },
            { dark: '#0a1945', light: '#e1cbf4', name: 'Navy & Lavender' },
            { dark: '#000000', light: '#ffffff', name: 'Classic B&W' },
            { dark: '#0033aa', light: '#e6f0ff', name: 'Blueprint' },
            { dark: '#4a2c11', light: '#f5e3d2', name: 'Sepia' },
            { dark: '#1a0b2e', light: '#ff007f', name: 'Cyberpunk Neon' },
            { dark: '#3b0000', light: '#ffeb3b', name: 'Crimson & Gold' }
        ];

        palettes.forEach(p => {
            const swatch = document.createElement('div');
            swatch.className = 'swatch';
            swatch.title = p.name;
            swatch.style.background = `linear-gradient(135deg, ${p.dark} 50%, ${p.light} 50%)`;

            swatch.addEventListener('click', () => {
                darkColorInput.value = p.dark;
                lightColorInput.value = p.light;
                if (cachedImageData) scheduleRender();
            });
            swatchContainer.appendChild(swatch);
        });

        function showError(message = 'Unsupported file. Please upload an image.') {
            errorMsg.textContent = message;
            errorMsg.style.display = 'block';
        }

        function clearError() {
            errorMsg.style.display = 'none';
        }

        function releaseObjectUrl() {
            if (currentObjectUrl) {
                URL.revokeObjectURL(currentObjectUrl);
                currentObjectUrl = null;
            }
        }

        function resetImage() {
            cachedImageData = null;
            cachedImageSize = { width: 0, height: 0 };
            canvas.width = 0;
            canvas.height = 0;
        }

        function fitWithin(width, height, maxDimension, maxPixels) {
            let scale = Math.min(1, maxDimension / Math.max(width, height));
            const pixels = (width * scale) * (height * scale);
            if (pixels > maxPixels) scale *= Math.sqrt(maxPixels / pixels);
            return {
                width: Math.max(1, Math.round(width * scale)),
                height: Math.max(1, Math.round(height * scale))
            };
        }

        function createImageDataFromImage(img, width, height, willReadFrequently = false) {
            const offscreenCanvas = document.createElement('canvas');
            offscreenCanvas.width = width;
            offscreenCanvas.height = height;
            const offCtx = offscreenCanvas.getContext('2d', { willReadFrequently });
            offCtx.drawImage(img, 0, 0, width, height);
            return { imageData: offCtx.getImageData(0, 0, width, height), width, height };
        }

        function preparePreviewImageData() {
            const sourceWidth = originalImage.naturalWidth || originalImage.width;
            const sourceHeight = originalImage.naturalHeight || originalImage.height;
            const { width, height } = fitWithin(
                sourceWidth, sourceHeight, MAX_PREVIEW_DIMENSION, MAX_PREVIEW_DIMENSION * MAX_PREVIEW_DIMENSION
            );
            const prepared = createImageDataFromImage(originalImage, width, height, true);
            cachedImageData = prepared.imageData;
            cachedImageSize = { width: prepared.width, height: prepared.height };
        }

        function renderHalftoneToContext(targetCtx, imageData, width, height, settings) {
            const { patternType, dotSize, textureLevel, darkColor, lightColor } = settings;
            const pixels = imageData.data;

            targetCtx.clearRect(0, 0, width, height);

            for (let y = 0; y < height; y += dotSize) {
                for (let x = 0; x < width; x += dotSize) {
                    let totalLuminance = 0;
                    let totalAlpha = 0;
                    let pixelCount = 0;

                    for (let dy = 0; dy < dotSize; dy++) {
                        for (let dx = 0; dx < dotSize; dx++) {
                            const currentX = x + dx;
                            const currentY = y + dy;
                            if (currentX >= width || currentY >= height) continue;

                            const i = (currentY * width + currentX) * 4;
                            const r = pixels[i];
                            const g = pixels[i + 1];
                            const b = pixels[i + 2];
                            const a = pixels[i + 3];

                            totalLuminance += (0.299 * r + 0.587 * g + 0.114 * b);
                            totalAlpha += a;
                            pixelCount++;
                        }
                    }

                    if (!pixelCount) continue;

                    const avgAlpha = totalAlpha / pixelCount;
                    if (avgAlpha < 15) continue;

                    targetCtx.fillStyle = lightColor;
                    targetCtx.fillRect(x, y, dotSize, dotSize);

                    let avgLuminance = totalLuminance / pixelCount;
                    const noise = (Math.random() - 0.5) * 100 * textureLevel;
                    avgLuminance = Math.max(0, Math.min(255, avgLuminance + noise));

                    const darkness = 1 - (avgLuminance / 255);
                    const sizeMultiplier = 1.3 + (Math.random() - 0.5) * textureLevel * 0.6;

                    const jitterX = (Math.random() - 0.5) * textureLevel * dotSize * 0.4;
                    const jitterY = (Math.random() - 0.5) * textureLevel * dotSize * 0.4;

                    const centerX = x + (dotSize / 2) + jitterX;
                    const centerY = y + (dotSize / 2) + jitterY;

                    if (patternType === 'dots') {
                        const radius = (dotSize / 2) * darkness * sizeMultiplier;
                        if (radius > 0.5) {
                            targetCtx.fillStyle = darkColor;
                            targetCtx.beginPath();
                            targetCtx.arc(centerX, centerY, Math.min(Math.abs(radius), dotSize * 1.5), 0, Math.PI * 2);
                            targetCtx.fill();
                        }
                    } else if (patternType === 'lines') {
                        const lineWidth = dotSize * darkness * sizeMultiplier * 1.2;
                        if (lineWidth > 0.5) {
                            targetCtx.strokeStyle = darkColor;
                            targetCtx.lineWidth = Math.min(lineWidth, dotSize * 1.5);
                            targetCtx.lineCap = 'round';
                            targetCtx.beginPath();

                            const angle = Math.PI / 4;
                            const length = dotSize * 1.5;
                            const dx = Math.cos(angle) * (length / 2);
                            const dy = Math.sin(angle) * (length / 2);

                            targetCtx.moveTo(centerX - dx, centerY - dy);
                            targetCtx.lineTo(centerX + dx, centerY + dy);
                            targetCtx.stroke();
                        }
                    }
                }
            }
        }

        function generateHalftone() {
            if (!cachedImageData) return;

            canvas.width = cachedImageSize.width;
            canvas.height = cachedImageSize.height;

            renderHalftoneToContext(ctx, cachedImageData, cachedImageSize.width, cachedImageSize.height, {
                patternType: patternTypeInput.value,
                dotSize: parseInt(dotSizeInput.value, 10),
                textureLevel: parseFloat(textureLevelInput.value),
                darkColor: darkColorInput.value,
                lightColor: lightColorInput.value
            });
        }

        function scheduleRender() {
            if (!cachedImageData || renderScheduled) return;
            renderScheduled = true;
            requestAnimationFrame(() => {
                renderScheduled = false;
                generateHalftone();
            });
        }

        upload.addEventListener('change', function(e) {
            clearError();
            const file = e.target.files && e.target.files[0];
            if (!file) return;

            const type = file.type ? file.type.toLowerCase() : '';
            const hasValidExtension = ALLOWED_EXTENSIONS.test(file.name || '');
            const isAllowed = type ? ALLOWED_IMAGE_TYPES.has(type) : hasValidExtension;
            if (!isAllowed) {
                showError();
                upload.value = '';
                fileNameEl.textContent = 'No file selected';
                return;
            }

            releaseObjectUrl();
            fileNameEl.textContent = file.name || 'Selected image';

            currentObjectUrl = URL.createObjectURL(file);
            originalImage.onload = () => {
                preparePreviewImageData();
                scheduleRender();
            };
            originalImage.onerror = () => {
                releaseObjectUrl();
                resetImage();
                upload.value = '';
                fileNameEl.textContent = 'No file selected';
                showError('Could not load image. Please choose a valid PNG, JPG, or WebP file.');
            };
            originalImage.src = currentObjectUrl;
        });

        [patternTypeInput, dotSizeInput, textureLevelInput, darkColorInput, lightColorInput].forEach(input => {
            input.addEventListener('input', () => {
                if (cachedImageData) scheduleRender();
            });
        });

        downloadBtn.addEventListener('click', () => {
            if (!cachedImageData) {
                alert('Please upload an image first!');
                return;
            }

            const sourceWidth = originalImage.naturalWidth || originalImage.width;
            const sourceHeight = originalImage.naturalHeight || originalImage.height;

            const exportSize = fitWithin(
                sourceWidth, sourceHeight, MAX_EXPORT_DIMENSION, MAX_EXPORT_PIXELS
            );

            const exportScale = exportSize.width / cachedImageSize.width;
            const exportDotSize = Math.max(
                1, Math.round(parseInt(dotSizeInput.value, 10) * exportScale)
            );

            const fullImage = createImageDataFromImage(
                originalImage, exportSize.width, exportSize.height
            );
            const exportCanvas = document.createElement('canvas');
            exportCanvas.width = exportSize.width;
            exportCanvas.height = exportSize.height;
            const exportCtx = exportCanvas.getContext('2d');

            renderHalftoneToContext(exportCtx, fullImage.imageData, exportSize.width, exportSize.height, {
                patternType: patternTypeInput.value,
                dotSize: exportDotSize,
                textureLevel: parseFloat(textureLevelInput.value),
                darkColor: darkColorInput.value,
                lightColor: lightColorInput.value
            });

            exportCanvas.toBlob((blob) => {
                if (!blob) {
                    alert('Could not generate the download for this image. Please try a smaller file.');
                    return;
                }

                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.download = 'halftone-gen-output.png';
                link.href = url;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                setTimeout(() => URL.revokeObjectURL(url), 1000);
            }, 'image/png');
        });
    </script>
</body>
</html>
